name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Copy web app into the Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../ChatForge.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatForge-apk
          path: ChatForge.apk

      - name: Publish to the "latest" release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ChatForge.apk \
            --title "ChatForge – latest build (#${{ github.run_number }})" \
            --notes "Built from ${GITHUB_SHA::7}. On your phone: download ChatForge.apk below and open it to install/update." \
            --target "$GITHUB_SHA"
